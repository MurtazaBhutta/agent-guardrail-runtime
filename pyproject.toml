[project]
name = "guardrail-runtime"
version = "0.1.0"
description = "A composable safety, spend and observability runtime around agent calls, with per-tenant policy enforced in the database"
requires-python = ">=3.11"
# No runtime dependencies. The middleware layer deliberately depends on nothing: it is pure
# policy over a handful of ports, so it installs and tests without a database or an API
# credential anywhere near it. Storage and model backends are opt-in extras.
dependencies = []

[project.optional-dependencies]
# openai is in dev only so the Azure client's error mapping is tested against the SDK's real
# exception types; the tests use a fake client and never touch the network.
dev = ["pytest>=8.0", "ruff>=0.6", "openai>=2.0"]
postgres = ["psycopg[binary]>=3.1"]
claude = ["anthropic>=0.69"]
azure = ["openai>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "postgres: requires a live PostgreSQL instance (set GUARDRAIL_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["guardrail_runtime", "conftest"]
